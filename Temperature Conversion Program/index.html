<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Temperature Conversion</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>

<form>
   <h1>Temperature Conversion:</h1>

   <input id="temperatureInputBox" type="number"> <br>

   <input id="toCelsiusBtn" type="radio" name="convertType">
   <label for="toCelsiusBtn"> Fahrenheit → Celsius</label> <br>

   <input id="toFahrenheitBtn" type="radio" name="convertType">
   <label for="toFahrenheitBtn">Celsius → Fahrenheit</label> <br>
   
   <button type="button" id="convertBtn">Convert</button>

   <p id="resultText"></p>

</form>
   
<script src="main.js"></script>

</body>
</html>
